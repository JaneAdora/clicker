[package]
name = "clicker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Protocol, pairing, TLS and config core for the Clicker Android TV remote."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
# Use the `ring` crypto provider (not the default aws-lc-rs) so the build needs only
# a C toolchain, no cmake. rcgen already uses ring, so this drops aws-lc-sys entirely.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", features = ["pem"] }
rsa = "0.9"
prost = "0.13"
sha2 = "0.10"
x509-parser = "0.16"
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
num-bigint-dig = "0.8"
rand = "0.8"
hex = "0.4"

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
tempfile = "3"
# Paused time for the deadline and retry tests.
tokio = { version = "1", features = ["test-util"] }
futures = "0.3"
